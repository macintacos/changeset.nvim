line-length    = 90
target-version = "py312" # ruff ignores PEP 723 requires-python: keep in sync with the scripts' header

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]
# The formatter owns the indentation rules and trailing commas; D203/D212 conflict with Google style.
ignore = ["W191", "E111", "E114", "E117", "D203", "D212", "COM812"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style           = "double"
indent-style          = "space"
docstring-code-format = true
