# rumdl config — rumdl lints AND formats Markdown (one tool): `rumdl check` lints,
# `rumdl fmt` formats; hk drives them via Builtins.rumdl_format and Builtins.rumdl.
# Reference: https://rumdl.dev
[global]
# MD013 (line length) off so prose isn't reflowed; inline HTML (MD033), bare URLs (MD034)
# and a non-h1 first line (MD041) are allowed.
disable = ["MD013", "MD033", "MD034", "MD041"]

# Respect .gitignore when scanning directories.
respect-gitignore = true

# Patterns rumdl skips.
exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  "dist",
  "build",
  "CHANGELOG.md",
  "LICENSE.md",
]

[MD024]
# Only flag duplicate headings that are siblings (share a parent), not across the
# whole document.
siblings-only = true
