# rumdl both lints and formats Markdown. https://rumdl.dev
[global]
# MD013 off so prose isn't reflowed; allow inline HTML, bare URLs, non-h1 first line.
disable = ["MD013", "MD033", "MD034", "MD041"]

respect-gitignore = true

exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  "dist",
  "build",
  "CHANGELOG.md",
  "LICENSE.md",
]

[MD024]
# Flag duplicate headings only among siblings.
siblings-only = true
